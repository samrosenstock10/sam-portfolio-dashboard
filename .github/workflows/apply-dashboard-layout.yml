name: Apply dashboard layout update

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-dashboard-layout.yml

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply requested dashboard changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          def replace_required(old: str, new: str, minimum: int = 1) -> None:
              global html
              count = html.count(old)
              if count < minimum:
                  raise RuntimeError(f"Expected at least {minimum} occurrence(s), found {count}: {old[:100]}")
              html = html.replace(old, new)

          # Remove the physical-gold quantity from both rendered content and embedded page data.
          replace_required(
              "Physical gold remains fixed at **4 troy oz**, valued at sourced close as of **Jul 31, 2026**, and represents",
              "Physical gold is valued at sourced close as of **Jul 31, 2026**, and represents",
          )
          replace_required(
              "Physical gold is treated as four troy ounces and valued at the latest sourced close;",
              "Physical gold is valued at the latest sourced close;",
          )
          replace_required(
              '"description":"Four troy ounces valued at the latest sourced USD spot price; premiums excluded."',
              '"description":"Physical gold valued at the latest sourced USD spot price; premiums excluded."',
          )
          replace_required(
              '"valuationBasis":"Four troy ounces at sourced close; dealer and numismatic premiums excluded."',
              '"valuationBasis":"Physical gold at sourced close; dealer and numismatic premiums excluded."',
          )
          replace_required('"ticker":"XAU · 4 oz"', '"ticker":"XAU"', minimum=2)
          replace_required(
              '["Physical gold",pct(D.gold.allocation),D.gold.ounces+" troy oz at spot"]',
              '["Physical gold",pct(D.gold.allocation),"Valued at spot"]',
          )
          html, gold_count = re.subn(
              r'"gold":\{"ounces":4,"spotPriceUsd":[^,]+,',
              '"gold":{',
              html,
              count=1,
          )
          if gold_count != 1:
              raise RuntimeError(f"Expected one embedded gold quantity record, found {gold_count}")

          # Replace the two broad trillion-dollar bands with $1T increments.
          market_caps = [
              {"category": "$1T–$2T", "allocation": 0.04608561549113248, "lineItems": 3, "securities": "META, AVGO, TSM"},
              {"category": "$2T–$3T", "allocation": 0.1656165802987536, "lineItems": 1, "securities": "AMZN"},
              {"category": "$3T–$4T", "allocation": 0.0009651671791545762, "lineItems": 1, "securities": "MSFT"},
              {"category": "$4T–$5T", "allocation": 0.28516156827353467, "lineItems": 3, "securities": "AAPL, GOOG + GOOGL, NVDA"},
              {"category": "$5T–$6T", "allocation": 0, "lineItems": 0, "securities": "None"},
              {"category": "$6T+", "allocation": 0, "lineItems": 0, "securities": "None"},
              {"category": "$750B–$1T", "allocation": 0.019919031241679423, "lineItems": 2, "securities": "MU, SKHY"},
              {"category": "$500B–$750B", "allocation": 0, "lineItems": 0, "securities": "None"},
              {"category": "$250B–$500B", "allocation": 0.01252742992028142, "lineItems": 3, "securities": "PLTR, COST, GEV"},
              {"category": "$125B–$250B", "allocation": 0.005321943266341469, "lineItems": 1, "securities": "CRWD"},
              {"category": "$75B–$125B", "allocation": 0.00445679456144855, "lineItems": 1, "securities": "NET"},
              {"category": "$25B–$75B", "allocation": 0.025031383646331767, "lineItems": 7, "securities": "NBIS, CRWV, RKLB, RDDT, BE, ALAB, VST"},
              {"category": "Under $25B", "allocation": 0.05563333425072422, "lineItems": 8, "securities": "OKLO, ASTS, APLD, LEU, FIG, TLN, ONTO, IONQ"},
          ]
          replacement = '"marketCaps":' + json.dumps(market_caps, ensure_ascii=False, separators=(",", ":")) + ',"structure":'
          html, market_count = re.subn(r'"marketCaps":\[[^\]]*\],"structure":', replacement, html, count=1)
          if market_count != 1:
              raise RuntimeError(f"Expected one market-cap dataset, found {market_count}")
          replace_required(
              'bars("market-bars",D.marketCaps,{name:r=>r.category,total:r=>r.allocation,max:.5,',
              'bars("market-bars",D.marketCaps,{name:r=>r.category,total:r=>r.allocation,max:.3,',
          )

          def pop_section(document: str, marker: str):
              pattern = re.compile(r'    <section\b[^>]*>.*?' + re.escape(marker) + r'.*?</section>\n', re.S)
              matches = list(pattern.finditer(document))
              if len(matches) != 1:
                  raise RuntimeError(f"Expected one section containing {marker!r}, found {len(matches)}")
              match = matches[0]
              return match.group(0), document[:match.start()] + document[match.end():]

          def insert_after_section(document: str, marker: str, block: str):
              pattern = re.compile(r'    <section\b[^>]*>.*?' + re.escape(marker) + r'.*?</section>\n', re.S)
              matches = list(pattern.finditer(document))
              if len(matches) != 1:
                  raise RuntimeError(f"Expected one insertion target containing {marker!r}, found {len(matches)}")
              match = matches[0]
              return document[:match.end()] + block + document[match.end():]

          # Reorder sections without changing their contents.
          changes, html = pop_section(html, 'id="changes"')
          concentration, html = pop_section(html, '<h2>Cumulative economic concentration</h2>')
          structure, html = pop_section(html, '<h2>Economic position-size structure</h2>')
          html = insert_after_section(html, '<h2>Roth IRA stock allocation</h2>', changes)
          html = insert_after_section(html, '<h2>Economic exposure mix</h2>', concentration + structure)

          # Verification: privacy, data, and requested section order.
          lowered = html.lower()
          for forbidden in ("4 troy oz", "four troy ounces", "xau · 4 oz", "d.gold.ounces"):
              if forbidden in lowered:
                  raise RuntimeError(f"Sensitive gold quantity remains in page source: {forbidden}")
          if '"category":"$2.5T+"' in html or '"category":"$1T–$2.5T"' in html:
              raise RuntimeError("Old market-cap buckets remain")
          required_buckets = ["$1T–$2T", "$2T–$3T", "$3T–$4T", "$4T–$5T", "$5T–$6T", "$6T+"]
          if not all(f'"category":"{bucket}"' in html for bucket in required_buckets):
              raise RuntimeError("One or more new market-cap buckets are missing")

          roth_i = html.index("<h2>Roth IRA stock allocation</h2>")
          changes_i = html.index('id="changes"')
          returns_i = html.index('id="return-history"')
          mix_i = html.index("<h2>Economic exposure mix</h2>")
          concentration_i = html.index("<h2>Cumulative economic concentration</h2>")
          structure_i = html.index("<h2>Economic position-size structure</h2>")
          table_i = html.index("<h2>All economic exposure rows</h2>")
          if not (roth_i < changes_i < returns_i):
              raise RuntimeError("Weekly changes section is not directly after Roth allocation")
          if not (mix_i < concentration_i < structure_i < table_i):
              raise RuntimeError("Concentration and position-size sections are not under exposure mix")

          path.write_text(html, encoding="utf-8")
          PY

      - name: Commit dashboard update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Improve dashboard privacy and section layout"
          git push origin main
