name: Monitor portfolio production parity

on:
  schedule:
    - cron: '17 12,23 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: portfolio-production-parity
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch stable production with bounded retries
        id: fetch
        continue-on-error: true
        run: curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-all-errors https://sam-portfolio-dashboard.vercel.app/ --output /tmp/production.html
      - name: Compare production with current main
        id: compare
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        run: node scripts/compare-production.mjs index.html /tmp/production.html
      - name: Open, refresh, or close one parity incident
        uses: actions/github-script@v7
        env:
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
          MATCHES: ${{ steps.compare.outputs.matches }}
          EXPECTED_HASH: ${{ steps.compare.outputs.expected_hash }}
          ACTUAL_HASH: ${{ steps.compare.outputs.actual_hash }}
          TITLE: Portfolio dashboard production parity alert
        with:
          script: |
            const title = process.env.TITLE;
            const healthy = process.env.FETCH_OUTCOME === 'success' && process.env.MATCHES === 'true';
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100,
            });
            const issue = issues.find((item) => !item.pull_request && item.title === title);
            if (healthy) {
              if (issue?.state === 'open') {
                await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, state: 'closed', state_reason: 'completed' });
              }
              return;
            }
            const body = [
              '## Production parity incident',
              '',
              `Production fetch: ${process.env.FETCH_OUTCOME || 'unknown'}`,
              `Expected main SHA-256: ${process.env.EXPECTED_HASH || 'unknown'}`,
              `Production SHA-256: ${process.env.ACTUAL_HASH || 'unknown'}`,
              '',
              'The stable Vercel URL is unreachable or does not serve the exact validated index.html currently on main. Preserve the last valid portfolio data and perform publication-only recovery; do not recalculate portfolio data solely to repair production.',
            ].join('\n');
            if (issue) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, body, state: 'open' });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }
      - name: Fail the check when production is unavailable or divergent
        if: steps.fetch.outcome != 'success' || steps.compare.outputs.matches != 'true'
        run: exit 1
