name: Run dashboard layout update

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/run-dashboard-layout.yml

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply requested dashboard changes
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          import re
          import textwrap

          workflow = Path('.github/workflows/apply-dashboard-layout.yml').read_text(encoding='utf-8')
          match = re.search(r"          python - <<'PY'\n(.*?)\n          PY", workflow, re.S)
          if not match:
              raise RuntimeError('Could not locate the dashboard update script')
          code = textwrap.dedent(match.group(1))
          exec(compile(code, 'apply-dashboard-layout.py', 'exec'), {})
          PYTHON

      - name: Commit dashboard update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Improve dashboard privacy and section layout"
          git push origin main
