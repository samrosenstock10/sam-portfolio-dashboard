name: Reorder market-cap buckets

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/market-cap-order-trigger

permissions:
  contents: write

jobs:
  reorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Reorder market-cap rows from largest to smallest
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          match = re.search(r'"marketCaps":(\[[^\]]*\]),"structure":', html)
          if not match:
              raise RuntimeError('marketCaps dataset not found')
          rows = json.loads(match.group(1))
          desired = [
              '$6T+', '$5T–$6T', '$4T–$5T', '$3T–$4T', '$2T–$3T', '$1T–$2T',
              '$750B–$1T', '$500B–$750B', '$250B–$500B', '$125B–$250B',
              '$75B–$125B', '$25B–$75B', 'Under $25B'
          ]
          by_category = {row['category']: row for row in rows}
          missing = [category for category in desired if category not in by_category]
          extra = [category for category in by_category if category not in desired]
          if missing or extra:
              raise RuntimeError(f'Unexpected categories. Missing={missing}; extra={extra}')
          reordered = [by_category[category] for category in desired]
          replacement = '"marketCaps":' + json.dumps(reordered, ensure_ascii=False, separators=(',', ':')) + ',"structure":'
          html = html[:match.start()] + replacement + html[match.end():]
          path.write_text(html, encoding='utf-8')

          check = path.read_text(encoding='utf-8')
          positions = [check.index(f'"category":"{category}"') for category in desired]
          if positions != sorted(positions):
              raise RuntimeError('Market-cap categories are not in descending order')
          PY

      - name: Commit updated order
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Order market-cap buckets from largest to smallest"
          git push origin main
