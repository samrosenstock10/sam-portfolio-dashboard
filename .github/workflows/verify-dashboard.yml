name: Verify portfolio dashboard

on:
  pull_request:
    paths:
      - 'AUTOMATION.md'
      - 'index.html'
      - 'vercel.json'
      - 'package.json'
      - 'lib/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/automation/**'
      - '.github/workflows/**'
  push:
    branches:
      - main
    paths:
      - 'AUTOMATION.md'
      - 'index.html'
      - 'vercel.json'
      - 'package.json'
      - 'lib/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/automation/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run contract tests
        run: npm test
      - name: Validate current deployable artifact
        run: npm run validate
      - name: Build the exact static artifact
        run: npm run build
      - name: Confirm source and build artifacts are byte-identical
        run: cmp -s index.html dist/index.html
      - name: Confirm the one-line mobile navigation is committed
        run: grep -Fq '@media(max-width:600px){.section-nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;flex-wrap:nowrap;width:100%}.section-nav a{display:flex;align-items:center;justify-content:center;padding:7px 2px;font-size:10px;min-height:36px;white-space:nowrap;width:100%;min-width:0}}' index.html
